<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ハビットトラッカー</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&family=Bebas+Neue&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="paper-bg" aria-hidden="true"></div>

<!-- 浮遊する装飾（スパークル・ハート） -->
<div class="floaters" id="floaters" aria-hidden="true"></div>

<div class="page">

  <header class="hero">
    <div class="hero-deco" aria-hidden="true"></div>
    <p class="eyebrow">STAY CONSISTENT, STAY YOU</p>
    <h1 class="title">ハビット<span class="title-accent">トラッカー</span></h1>
    <p class="tagline">なりたい自分になるために</p>
  </header>

  <nav class="tab-bar" id="tabBar" aria-label="月を選択"></nav>

  <main class="tab-content" id="tabContent"></main>

</div>

<!-- リセット確認ダイアログ -->
<div class="modal-backdrop" id="resetModalBackdrop">
  <div class="modal-box">
    <p class="modal-title">このタブの記録をリセットしますか？</p>
    <p class="modal-sub">この操作は取り消せません。</p>
    <div class="modal-actions">
      <button type="button" id="resetCancel" class="modal-btn cancel">キャンセル</button>
      <button type="button" id="resetConfirm" class="modal-btn confirm">リセットする</button>
    </div>
  </div>
</div>

<!-- タブ削除確認ダイアログ -->
<div class="modal-backdrop" id="deleteModalBackdrop">
  <div class="modal-box">
    <p class="modal-title" id="deleteModalTitle">このタブを削除しますか？</p>
    <p class="modal-sub">記録もすべて削除され、元に戻せません。</p>
    <div class="modal-actions">
      <button type="button" id="deleteCancel" class="modal-btn cancel">キャンセル</button>
      <button type="button" id="deleteConfirm" class="modal-btn confirm">削除する</button>
    </div>
  </div>
</div>

<!-- 1〜10 数値選択ダイアログ -->
<div class="modal-backdrop" id="numberModalBackdrop">
  <div class="modal-box">
    <p class="modal-title" id="numberModalTitle">–</p>
    <div class="number-grid" id="numberGrid"></div>
    <div class="modal-actions">
      <button type="button" id="numberClear" class="modal-btn cancel">クリア</button>
      <button type="button" id="numberClose" class="modal-btn cancel">閉じる</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
